name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run root component unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/app.component.spec.ts

      - name: Build production bundle
        shell: bash
        run: npm run build -- --prod

      - name: Audit production dependencies
        shell: bash
        run: npm audit --omit=dev --audit-level=critical > audit.log 2>&1

      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-audit-log
          path: audit.log
          if-no-files-found: ignore
          retention-days: 1
